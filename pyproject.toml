[project]
name = "people-analytics-case-study"
version = "0.1.0"
description = "Technical case study of an end-to-end batch machine learning system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# Representative technology stack.
# The original project environment and lockfile are not published.

[dependency-groups]
machine-learning = [
    "pandas",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "shap",
]

cloud-mlops = [
    "kfp",
    "mlflow",
    "google-cloud-aiplatform",
    "google-cloud-bigquery",
    "google-cloud-storage",
]

nlp = [
    "spacy",
    "nltk",
    "google-genai",
    "google-cloud-language",
]

serving = [
    "flask",
    "gunicorn",
]